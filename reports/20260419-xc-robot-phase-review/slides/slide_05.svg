<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css">
      .serif-title { font-family: 'Source Han Serif SC','Noto Serif CJK SC','Songti SC','SimSun',serif; }
      .sans-body   { font-family: 'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .en-serif    { font-family: 'Merriweather','Georgia','Times New Roman',serif; }
      .en-sans     { font-family: 'Inter','Helvetica Neue','Arial',sans-serif; }
      .mono        { font-family: 'JetBrains Mono','SF Mono','Menlo','Consolas',monospace; }
    </style>
  </defs>

  <!-- 背景：象牙米白 -->
  <rect width="1280" height="720" fill="#F7F3EB"/>

  <!-- 左侧章节竖线（学院金） -->
  <rect x="0" y="0" width="4" height="720" fill="#C9A961"/>

  <!-- ===== 顶部章节标识 ===== -->
  <text x="56" y="62" font-size="13" fill="#C9A961" letter-spacing="2" class="sans-body">
    PART A · 项目背景 / P5 · 代际演进 · MVP 1.0 vs MVP 2.0
  </text>

  <!-- ===== 主标题 ===== -->
  <text x="56" y="116" font-size="38" font-weight="700" fill="#0A2540" class="serif-title">
    代际演进 · 商用方案 / 开源自研国产化
  </text>

  <!-- ===== 英文副标题 ===== -->
  <text x="56" y="148" font-size="16" fill="#8B95A8" font-style="italic" class="en-serif">
    Generation Evolution — From Off-the-Shelf to Open-Source Self-Developed
  </text>

  <!-- ===== 标题底部装饰线 ===== -->
  <line x1="56" y1="168" x2="220" y2="168" stroke="#C9A961" stroke-width="2"/>
  <line x1="220" y1="168" x2="560" y2="168" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>

  <!-- ===== 顶部中央演进箭头（SVG path 画学院金细箭头） ===== -->
  <!-- 从 x=540 到 x=740, y=220 -->
  <line x1="540" y1="220" x2="734" y2="220" stroke="#C9A961" stroke-width="1.5"/>
  <path d="M 728 214 L 742 220 L 728 226 Z" fill="#C9A961"/>
  <text x="640" y="208" font-size="11" fill="#C9A961" letter-spacing="2" text-anchor="middle" class="sans-body">EVOLUTION · 演进方向</text>

  <!-- 中间分隔竖线（暖灰 0.5px） -->
  <line x1="640" y1="244" x2="640" y2="604" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>

  <!-- ===== 左侧 MVP 1.0（暖灰 + 虚线边框，表示过去） ===== -->
  <g>
    <!-- 虚线边框 -->
    <rect x="56" y="244" width="560" height="360" fill="none" stroke="#8B95A8" stroke-width="1" stroke-dasharray="6 4" rx="3"/>
    <!-- 时代徽章 -->
    <rect x="56" y="244" width="130" height="32" fill="#8B95A8"/>
    <text x="121" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#F7F3EB" letter-spacing="2" class="en-sans">GEN 1  ·  PAST</text>

    <!-- 标题 -->
    <text x="76" y="314" font-size="24" fill="#8B95A8" class="en-serif">MVP 1.0  ·  2025 Q3</text>
    <text x="76" y="340" font-size="14" fill="#2B3340" class="sans-body">商用成品方案</text>

    <!-- 分隔线 -->
    <line x1="76" y1="356" x2="596" y2="356" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>

    <!-- 字段行 -->
    <g class="sans-body">
      <!-- 机械臂类型 -->
      <text x="76" y="384" font-size="12" fill="#8B95A8">机械臂类型</text>
      <text x="260" y="384" font-size="15" fill="#2B3340">法奥意威 FR3 协作臂 x 2</text>
      <line x1="76" y1="394" x2="596" y2="394" stroke="#8B95A8" stroke-width="0.3" opacity="0.35"/>

      <!-- 自由度 -->
      <text x="76" y="418" font-size="12" fill="#8B95A8">自由度</text>
      <text x="260" y="418" font-size="15" fill="#2B3340">6 DOF / 臂</text>
      <line x1="76" y1="428" x2="596" y2="428" stroke="#8B95A8" stroke-width="0.3" opacity="0.35"/>

      <!-- 控制方式 -->
      <text x="76" y="452" font-size="12" fill="#8B95A8">控制方式</text>
      <text x="260" y="452" font-size="15" fill="#2B3340">FR3 官方 SDK + 私有协议</text>
      <line x1="76" y1="462" x2="596" y2="462" stroke="#8B95A8" stroke-width="0.3" opacity="0.35"/>

      <!-- 电机方案 -->
      <text x="76" y="486" font-size="12" fill="#8B95A8">电机方案</text>
      <text x="260" y="486" font-size="15" fill="#2B3340">一体化协作臂 · 不可拆解</text>
      <line x1="76" y1="496" x2="596" y2="496" stroke="#8B95A8" stroke-width="0.3" opacity="0.35"/>

      <!-- 减速方案 -->
      <text x="76" y="520" font-size="12" fill="#8B95A8">减速方案</text>
      <text x="260" y="520" font-size="15" fill="#2B3340">谐波减速</text>
      <line x1="76" y1="530" x2="596" y2="530" stroke="#8B95A8" stroke-width="0.3" opacity="0.35"/>

      <!-- 成本 -->
      <text x="76" y="560" font-size="12" fill="#8B95A8">成本</text>
      <text x="260" y="560" font-size="18" font-weight="600" fill="#8B95A8" class="mono">单臂  &gt;  ¥5 万</text>
    </g>
  </g>

  <!-- ===== 右侧 MVP 2.0（深靛蓝 + 实线边框，表示现在） ===== -->
  <g>
    <!-- 实线边框 -->
    <rect x="664" y="244" width="560" height="360" fill="none" stroke="#0A2540" stroke-width="1.5" rx="3"/>
    <!-- 时代徽章 -->
    <rect x="664" y="244" width="150" height="32" fill="#0A2540"/>
    <text x="739" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#C9A961" letter-spacing="2" class="en-sans">GEN 2  ·  CURRENT</text>

    <!-- 标题 -->
    <text x="684" y="314" font-size="24" fill="#0A2540" font-weight="700" class="en-serif">MVP 2.0  ·  2026 Q1 至今</text>
    <text x="684" y="340" font-size="14" fill="#2B3340" class="sans-body">开源自研国产化方案</text>

    <!-- 分隔线 -->
    <line x1="684" y1="356" x2="1204" y2="356" stroke="#C9A961" stroke-width="1" opacity="0.8"/>

    <!-- 字段行 -->
    <g class="sans-body">
      <!-- 机械臂类型 -->
      <text x="684" y="384" font-size="12" fill="#8B95A8">机械臂类型</text>
      <text x="868" y="384" font-size="15" fill="#2B3340">OpenArmX + 达妙 DM 电机</text>
      <line x1="684" y1="394" x2="1204" y2="394" stroke="#8B95A8" stroke-width="0.3" opacity="0.35"/>

      <!-- 自由度 -->
      <text x="684" y="418" font-size="12" fill="#8B95A8">自由度</text>
      <text x="868" y="418" font-size="15" fill="#2B3340">5 DOF / 臂</text>
      <line x1="684" y1="428" x2="1204" y2="428" stroke="#8B95A8" stroke-width="0.3" opacity="0.35"/>

      <!-- 控制方式 -->
      <text x="684" y="452" font-size="12" fill="#8B95A8">控制方式</text>
      <text x="868" y="452" font-size="15" fill="#2B3340">ROS 2 + MIT + 自研 openarmx_xc</text>
      <line x1="684" y1="462" x2="1204" y2="462" stroke="#8B95A8" stroke-width="0.3" opacity="0.35"/>

      <!-- 电机方案 -->
      <text x="684" y="486" font-size="12" fill="#8B95A8">电机方案</text>
      <text x="868" y="486" font-size="15" fill="#2B3340">分立关节电机 · DM 系列</text>
      <line x1="684" y1="496" x2="1204" y2="496" stroke="#8B95A8" stroke-width="0.3" opacity="0.35"/>

      <!-- 减速方案 -->
      <text x="684" y="520" font-size="12" fill="#8B95A8">减速方案</text>
      <text x="868" y="520" font-size="15" fill="#2B3340">9:1 行星减速 · 准直驱</text>
      <line x1="684" y1="530" x2="1204" y2="530" stroke="#8B95A8" stroke-width="0.3" opacity="0.35"/>

      <!-- 成本（学院金加粗） -->
      <text x="684" y="560" font-size="12" fill="#C9A961" letter-spacing="1">成本</text>
      <text x="868" y="562" font-size="20" font-weight="700" fill="#C9A961" class="mono">双臂  ~=  ¥1 - 1.5 万</text>
    </g>
  </g>

  <!-- ===== 底部分隔线 ===== -->
  <line x1="56" y1="632" x2="1224" y2="632" stroke="#8B95A8" stroke-width="0.5" opacity="0.4"/>

  <!-- ===== 底部总结行 ===== -->
  <text x="56" y="662" font-size="11" fill="#C9A961" letter-spacing="2" class="sans-body">ROUTE POSITIONING · 路线定位</text>
  <text x="640" y="662" font-size="14" fill="#0A2540" font-style="italic" text-anchor="middle" class="serif-title">
    技术验证 / 客户 Demo  ——  产品化 / 长期迭代   ·   白盒开源 + 国产化
  </text>

  <!-- ===== 页脚 ===== -->
  <line x1="56" y1="686" x2="1224" y2="686" stroke="#8B95A8" stroke-width="0.3" opacity="0.3"/>
  <text x="56" y="706" font-size="11" fill="#8B95A8" class="sans-body">XC-Robot · 2026-04 阶段汇报 · 袁鑫</text>
  <text x="1224" y="706" font-size="11" fill="#8B95A8" text-anchor="end" class="en-sans">05 / 34</text>

</svg>

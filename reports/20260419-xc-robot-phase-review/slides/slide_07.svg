<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css">
      .serif-title { font-family: 'Source Han Serif SC','Noto Serif CJK SC','Songti SC','SimSun',serif; }
      .sans-body   { font-family: 'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .en-serif    { font-family: 'Merriweather','Georgia','Times New Roman',serif; }
      .en-sans     { font-family: 'Inter','Helvetica Neue','Arial',sans-serif; }
      .mono        { font-family: 'JetBrains Mono','SF Mono','Menlo','Consolas',monospace; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#F7F3EB"/>
  <rect x="0" y="0" width="4" height="720" fill="#C9A961"/>

  <!-- 顶部标题区 -->
  <text x="56" y="62" font-size="13" fill="#C9A961" letter-spacing="2" class="sans-body">
    PART B · 当前现状 / 主控架构
  </text>

  <text x="56" y="116" font-size="38" font-weight="700" fill="#0A2540" class="serif-title">
    主控架构切换 · X86 Mini PC 的 5 条原因
  </text>

  <text x="56" y="148" font-size="16" fill="#8B95A8" font-style="italic" class="en-serif">
    Why X86 Over RDK — Ecosystem, Debugging, Compute, Reliability, Supply
  </text>

  <line x1="56" y1="168" x2="220" y2="168" stroke="#C9A961" stroke-width="2"/>
  <line x1="220" y1="168" x2="560" y2="168" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>

  <!-- ===== 顶部 Banner 对比 ===== -->
  <rect x="56" y="186" width="1168" height="50" fill="none" stroke="#2B3340" stroke-width="1" rx="2"/>
  <!-- 原方案（虚线 + 暖灰） -->
  <text x="80" y="207" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">FROM · 原</text>
  <text x="80" y="226" font-size="14" fill="#8B95A8" text-decoration="line-through" class="sans-body">RDK S100 + RDK X5</text>
  <!-- 箭头 -->
  <path d="M 420 212 L 500 212 L 490 207 M 500 212 L 490 217" stroke="#C9A961" stroke-width="1.5" fill="none"/>
  <!-- 现方案 -->
  <text x="540" y="207" font-size="11" fill="#C9A961" letter-spacing="1" class="en-sans">TO · 现</text>
  <text x="540" y="226" font-size="14" font-weight="700" fill="#0A2540" class="sans-body">双 X86 Mini PC · Intel i5 + i7</text>
  <!-- 右侧状态标 -->
  <rect x="1110" y="200" width="96" height="22" fill="#C9A961"/>
  <text x="1158" y="216" font-size="11" font-weight="700" fill="#0A2540" text-anchor="middle" letter-spacing="1" class="en-sans">BASELINE</text>

  <!-- ===== 5 条原因卡片（2x3 网格） ===== -->
  <!-- 卡片参数：宽 380 高 200，间距 14 -->
  <!-- 行 1：3 张 -->

  <!-- 1. 生态兼容性 -->
  <g>
    <rect x="56" y="258" width="380" height="200" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="380" y="330" font-size="54" font-weight="700" fill="#C9A961" opacity="0.5" text-anchor="end" class="en-serif">01</text>
    <text x="76" y="290" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">ECOSYSTEM</text>
    <text x="76" y="316" font-size="20" font-weight="700" fill="#0A2540" class="sans-body">生态兼容性</text>
    <line x1="76" y1="328" x2="160" y2="328" stroke="#C9A961" stroke-width="1.2"/>
    <text x="76" y="360" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="76" dy="0">ROS 2 + MoveIt 2 + Nav2 + OpenVINO</tspan>
      <tspan x="76" dy="20">原生可用 · apt install 即得</tspan>
      <tspan x="76" dy="20">避开 RDK BPU 专用 SDK</tspan>
      <tspan x="76" dy="20">学习与移植成本显著降低</tspan>
    </text>
  </g>

  <!-- 2. 调试便利性 -->
  <g>
    <rect x="450" y="258" width="380" height="200" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="774" y="330" font-size="54" font-weight="700" fill="#C9A961" opacity="0.5" text-anchor="end" class="en-serif">02</text>
    <text x="470" y="290" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">DEBUGGING</text>
    <text x="470" y="316" font-size="20" font-weight="700" fill="#0A2540" class="sans-body">调试便利性</text>
    <line x1="470" y1="328" x2="554" y2="328" stroke="#C9A961" stroke-width="1.2"/>
    <text x="470" y="360" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="470" dy="0">Mini PC 即插即用 · 直连显示器键鼠</tspan>
      <tspan x="470" dy="20">与开发工作站同构</tspan>
      <tspan x="470" dy="20">部署摩擦降低 <tspan fill="#C9A961" font-weight="700">80%</tspan></tspan>
      <tspan x="470" dy="20">问题定位周期缩短</tspan>
    </text>
  </g>

  <!-- 3. 算力灵活性 -->
  <g>
    <rect x="844" y="258" width="380" height="200" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="1168" y="330" font-size="54" font-weight="700" fill="#C9A961" opacity="0.5" text-anchor="end" class="en-serif">03</text>
    <text x="864" y="290" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">COMPUTE</text>
    <text x="864" y="316" font-size="20" font-weight="700" fill="#0A2540" class="sans-body">算力灵活性</text>
    <line x1="864" y1="328" x2="948" y2="328" stroke="#C9A961" stroke-width="1.2"/>
    <text x="864" y="360" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="864" dy="0">Intel i5 / i7 · <tspan fill="#C9A961" font-weight="700">10-20 核</tspan> + iGPU</tspan>
      <tspan x="864" dy="20">OpenVINO 原生加速</tspan>
      <tspan x="864" dy="20">必要时 PCIe / USB 4</tspan>
      <tspan x="864" dy="20">外接 AI 加速卡保留通路</tspan>
    </text>
  </g>

  <!-- 行 2：2 张居中 -->
  <!-- 4. 工业可靠性 -->
  <g>
    <rect x="253" y="476" width="380" height="200" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="577" y="548" font-size="54" font-weight="700" fill="#C9A961" opacity="0.5" text-anchor="end" class="en-serif">04</text>
    <text x="273" y="508" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">RELIABILITY</text>
    <text x="273" y="534" font-size="20" font-weight="700" fill="#0A2540" class="sans-body">工业可靠性</text>
    <line x1="273" y1="546" x2="357" y2="546" stroke="#C9A961" stroke-width="1.2"/>
    <text x="273" y="578" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="273" dy="0">华硕 / Intel 原厂 Mini PC</tspan>
      <tspan x="273" dy="20"><tspan fill="#C9A961" font-weight="700">24 / 7</tspan> 运行表现稳定</tspan>
      <tspan x="273" dy="20">优于消费级开发板</tspan>
      <tspan x="273" dy="20">符合工业交付语境</tspan>
    </text>
  </g>

  <!-- 5. 供应链稳定性 -->
  <g>
    <rect x="647" y="476" width="380" height="200" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="971" y="548" font-size="54" font-weight="700" fill="#C9A961" opacity="0.5" text-anchor="end" class="en-serif">05</text>
    <text x="667" y="508" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">SUPPLY CHAIN</text>
    <text x="667" y="534" font-size="20" font-weight="700" fill="#0A2540" class="sans-body">供应链稳定性</text>
    <line x1="667" y1="546" x2="787" y2="546" stroke="#C9A961" stroke-width="1.2"/>
    <text x="667" y="578" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="667" dy="0">Intel 量产多年 · 渠道成熟</tspan>
      <tspan x="667" dy="20">避开国产 AI 芯片供货</tspan>
      <tspan x="667" dy="20">波动风险与备货周期</tspan>
      <tspan x="667" dy="20">不因缺芯拖累整机交付</tspan>
    </text>
  </g>

  <!-- 底部提示 -->
  <line x1="56" y1="688" x2="1224" y2="688" stroke="#8B95A8" stroke-width="0.3" opacity="0.3"/>
  <text x="56" y="702" font-size="12" fill="#8B95A8" font-style="italic" class="sans-body">
    BOM v2.1 表 A 中 RDK 方案保留为备选参考 · 不再是当前开发基线
  </text>

  <!-- 页脚 -->
  <text x="56" y="716" font-size="11" fill="#8B95A8" class="sans-body">XC-Robot · 2026-04 阶段汇报 · 袁鑫</text>
  <text x="1224" y="716" font-size="11" fill="#8B95A8" text-anchor="end" class="en-sans">7 / 34</text>

</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css">
      .serif-title { font-family: 'Source Han Serif SC','Noto Serif CJK SC','Songti SC','SimSun',serif; }
      .sans-body   { font-family: 'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .en-serif    { font-family: 'Merriweather','Georgia','Times New Roman',serif; }
      .en-sans     { font-family: 'Inter','Helvetica Neue','Arial',sans-serif; }
      .mono        { font-family: 'JetBrains Mono','SF Mono','Menlo','Consolas',monospace; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#F7F3EB"/>
  <rect x="0" y="0" width="4" height="720" fill="#C9A961"/>

  <!-- ===== 顶部标题区 ===== -->
  <text x="56" y="62" font-size="13" fill="#C9A961" letter-spacing="2" class="sans-body">
    PART D · 一期 P0 落地
  </text>

  <text x="56" y="116" font-size="38" font-weight="700" fill="#0A2540" class="serif-title">
    3 个月里程碑 · RD2 阶段
  </text>

  <text x="56" y="148" font-size="16" fill="#8B95A8" font-style="italic" class="en-serif">
    3-Month Milestones — Monthly Gate Criteria
  </text>

  <line x1="56" y1="168" x2="220" y2="168" stroke="#C9A961" stroke-width="2"/>
  <line x1="220" y1="168" x2="560" y2="168" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>

  <!-- ===== 4 列时间轴 ===== -->
  <!-- 每列宽 280，起始 x=56，间距 16 -->
  <!-- 列 y=200，高 380 -->

  <!-- 列间箭头（学院金，路径型） -->
  <path d="M 338 380 L 350 376 L 350 384 Z" fill="#C9A961"/>
  <line x1="336" y1="380" x2="350" y2="380" stroke="#C9A961" stroke-width="1.5"/>

  <path d="M 634 380 L 646 376 L 646 384 Z" fill="#C9A961"/>
  <line x1="632" y1="380" x2="646" y2="380" stroke="#C9A961" stroke-width="1.5"/>

  <path d="M 930 380 L 942 376 L 942 384 Z" fill="#C9A961"/>
  <line x1="928" y1="380" x2="942" y2="380" stroke="#C9A961" stroke-width="1.5"/>

  <!-- ===== 列 1 · 2026-05 末 ===== -->
  <g>
    <rect x="56" y="200" width="280" height="380" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <!-- 顶部月份色块（深靛蓝） -->
    <rect x="56" y="200" width="280" height="58" fill="#0A2540"/>
    <text x="196" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#F7F3EB" class="serif-title">2026-05 末</text>
    <text x="196" y="250" text-anchor="middle" font-size="11" fill="#C9A961" letter-spacing="2" class="en-sans">MONTH 1 · STARTUP</text>

    <!-- 状态标签 -->
    <text x="76" y="288" font-size="11" fill="#8B95A8" letter-spacing="1" class="sans-body">STATUS · 启动期目标</text>
    <line x1="76" y1="298" x2="316" y2="298" stroke="#C9A961" stroke-width="1" opacity="0.6"/>

    <!-- 要点列表 -->
    <text x="76" y="328" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="76" dy="0">1. 机械臂悬空 60s 不下沉</tspan>
      <tspan x="76" dy="40">2. 关节漂移</tspan>
      <tspan x="76" dy="20" font-weight="600" fill="#0A2540" class="mono">    &lt;0.05 rad</tspan>
      <tspan x="76" dy="40">3. 底盘直线 10m</tspan>
      <tspan x="76" dy="20" font-weight="600" fill="#0A2540" class="mono">    漂移 &lt;15 cm</tspan>
    </text>

    <!-- 底部总结条 -->
    <line x1="76" y1="540" x2="316" y2="540" stroke="#C9A961" stroke-width="0.8" opacity="0.5"/>
    <text x="76" y="562" font-size="11" fill="#C9A961" font-weight="600" class="sans-body">交付标志 · 环境就绪</text>
  </g>

  <!-- ===== 列 2 · 2026-06 末 ===== -->
  <g>
    <rect x="352" y="200" width="280" height="380" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <rect x="352" y="200" width="280" height="58" fill="#0A2540"/>
    <text x="492" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#F7F3EB" class="serif-title">2026-06 末</text>
    <text x="492" y="250" text-anchor="middle" font-size="11" fill="#C9A961" letter-spacing="2" class="en-sans">MONTH 2 · FOUNDATION</text>

    <text x="372" y="288" font-size="11" fill="#8B95A8" letter-spacing="1" class="sans-body">STATUS · 打基础</text>
    <line x1="372" y1="298" x2="612" y2="298" stroke="#C9A961" stroke-width="1" opacity="0.6"/>

    <text x="372" y="328" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="372" dy="0">1. PREEMPT_RT + 500 Hz</tspan>
      <tspan x="372" dy="20" font-weight="600" fill="#0A2540" class="mono">    effort 接口打通</tspan>
      <tspan x="372" dy="40">2. 手眼标定完成</tspan>
      <tspan x="372" dy="20" font-weight="600" fill="#0A2540" class="mono">    (+/- 0.6 mm)</tspan>
      <tspan x="372" dy="40">3. 底盘 Nav2 参数调优</tspan>
    </text>

    <line x1="372" y1="540" x2="612" y2="540" stroke="#C9A961" stroke-width="0.8" opacity="0.5"/>
    <text x="372" y="562" font-size="11" fill="#C9A961" font-weight="600" class="sans-body">交付标志 · 底层栈可用</text>
  </g>

  <!-- ===== 列 3 · 2026-07 末 ===== -->
  <g>
    <rect x="648" y="200" width="280" height="380" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <rect x="648" y="200" width="280" height="58" fill="#0A2540"/>
    <text x="788" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#F7F3EB" class="serif-title">2026-07 末</text>
    <text x="788" y="250" text-anchor="middle" font-size="11" fill="#C9A961" letter-spacing="2" class="en-sans">MONTH 3 · MODULE OK</text>

    <text x="668" y="288" font-size="11" fill="#8B95A8" letter-spacing="1" class="sans-body">STATUS · 单模块达标</text>
    <line x1="668" y1="298" x2="908" y2="298" stroke="#C9A961" stroke-width="1" opacity="0.6"/>

    <text x="668" y="322" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="668" dy="0">1. 单臂 P2P 规划</tspan>
      <tspan x="668" dy="18" font-weight="600" fill="#0A2540" class="mono">    20/20 (偏差 &lt;5mm)</tspan>
      <tspan x="668" dy="30">2. 底盘 10 点位到达</tspan>
      <tspan x="668" dy="18" font-weight="600" fill="#0A2540" class="mono">    工位对接 &lt;3cm</tspan>
      <tspan x="668" dy="30">3. 物料识别率</tspan>
      <tspan x="668" dy="18" font-weight="600" fill="#0A2540" class="mono">    &gt;=80%</tspan>
      <tspan x="668" dy="30">4. 语音指令 10/8 成功</tspan>
    </text>

    <line x1="668" y1="540" x2="908" y2="540" stroke="#C9A961" stroke-width="0.8" opacity="0.5"/>
    <text x="668" y="562" font-size="11" fill="#C9A961" font-weight="600" class="sans-body">交付标志 · 单模块达指标</text>
  </g>

  <!-- ===== 列 4 · 2026-08 末（最重要，学院金背景） ===== -->
  <g>
    <rect x="944" y="196" width="280" height="388" fill="#FFFDF5" stroke="#C9A961" stroke-width="2" rx="3"/>
    <rect x="944" y="196" width="280" height="58" fill="#C9A961"/>
    <text x="1084" y="226" text-anchor="middle" font-size="22" font-weight="700" fill="#0A2540" class="serif-title">2026-08 末</text>
    <text x="1084" y="246" text-anchor="middle" font-size="11" fill="#0A2540" letter-spacing="2" class="en-sans">DELIVERY MILESTONE</text>

    <text x="964" y="286" font-size="11" fill="#C9A961" letter-spacing="1" font-weight="700" class="sans-body">CRITICAL · 交付里程碑</text>
    <line x1="964" y1="296" x2="1204" y2="296" stroke="#C9A961" stroke-width="1.2"/>

    <text x="964" y="326" font-size="14" font-weight="700" fill="#0A2540" class="sans-body">全链路 Demo 跑通</text>

    <text x="964" y="354" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="964" dy="0">"语音 / 导航 /</tspan>
      <tspan x="964" dy="20">  抓取 / 放置"</tspan>
    </text>

    <!-- 关键指标 -->
    <rect x="964" y="404" width="240" height="42" fill="none" stroke="#C9A961" stroke-width="1" rx="2"/>
    <text x="976" y="420" font-size="10" fill="#8B95A8" letter-spacing="1" class="sans-body">SUCCESS RATE</text>
    <text x="1192" y="434" text-anchor="end" font-size="20" font-weight="700" fill="#C9A961" class="mono">10 次 &gt;=8 次</text>

    <rect x="964" y="454" width="240" height="42" fill="none" stroke="#C9A961" stroke-width="1" rx="2"/>
    <text x="976" y="470" font-size="10" fill="#8B95A8" letter-spacing="1" class="sans-body">STABILITY</text>
    <text x="1192" y="484" text-anchor="end" font-size="20" font-weight="700" fill="#C9A961" class="mono">4h 不死机</text>

    <line x1="964" y1="540" x2="1204" y2="540" stroke="#C9A961" stroke-width="1"/>
    <text x="964" y="562" font-size="11" fill="#0A2540" font-weight="700" class="sans-body">交付标志 · 全链路闭环</text>
  </g>

  <!-- ===== 底部交付标准对照 ===== -->
  <rect x="56" y="602" width="1168" height="70" fill="none" stroke="#2B3340" stroke-width="1" rx="2"/>
  <line x1="640" y1="602" x2="640" y2="672" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>
  <text x="72" y="622" font-size="11" fill="#8B95A8" letter-spacing="1" class="sans-body">ACCEPTANCE BASELINE · 交付基线</text>
  <text x="72" y="644" font-size="13" fill="#2B3340" class="sans-body">
    揭榜挂帅阶段二标准 · <tspan fill="#C9A961" font-weight="700">80% 目标值基线</tspan>
  </text>
  <text x="72" y="662" font-size="12" fill="#8B95A8" class="sans-body">
    不追求一次到位 · 迭代攻坚
  </text>
  <text x="656" y="622" font-size="11" fill="#8B95A8" letter-spacing="1" class="sans-body">THIRD-PARTY TEST · 第三方检测</text>
  <text x="656" y="644" font-size="13" fill="#2B3340" class="sans-body">
    第三方 CNAS 检测准备 · <tspan fill="#0A2540" font-weight="600">RD4 (2026-11)</tspan>
  </text>
  <text x="656" y="662" font-size="12" fill="#8B95A8" class="sans-body">
    正式送检窗口
  </text>

  <!-- ===== 页脚 ===== -->
  <line x1="56" y1="686" x2="1224" y2="686" stroke="#8B95A8" stroke-width="0.3" opacity="0.3"/>
  <text x="56" y="706" font-size="11" fill="#8B95A8" class="sans-body">XC-Robot · 2026-04 阶段汇报 · 袁鑫</text>
  <text x="1224" y="706" font-size="11" fill="#8B95A8" text-anchor="end" class="en-sans">30 / 34</text>

</svg>

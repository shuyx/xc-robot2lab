<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css">
      .serif-title { font-family: 'Source Han Serif SC','Noto Serif CJK SC','Songti SC','SimSun',serif; }
      .sans-body   { font-family: 'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .en-serif    { font-family: 'Merriweather','Georgia','Times New Roman',serif; }
      .en-sans     { font-family: 'Inter','Helvetica Neue','Arial',sans-serif; }
      .mono        { font-family: 'JetBrains Mono','SF Mono','Menlo','Consolas',monospace; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#F7F3EB"/>
  <rect x="0" y="0" width="4" height="720" fill="#C9A961"/>

  <!-- 顶部标题 -->
  <text x="56" y="62" font-size="13" fill="#C9A961" letter-spacing="2" class="sans-body">
    PART B · 当前现状 / 主控架构
  </text>

  <text x="56" y="116" font-size="38" font-weight="700" fill="#0A2540" class="serif-title">
    双 X86 分工 · 慢线程 / 快线程
  </text>

  <text x="56" y="148" font-size="16" fill="#8B95A8" font-style="italic" class="en-serif">
    Dual-Brain Topology — Planning Brain + Real-Time Brain
  </text>

  <line x1="56" y1="168" x2="220" y2="168" stroke="#C9A961" stroke-width="2"/>
  <line x1="220" y1="168" x2="560" y2="168" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>

  <!-- ===== 左右两大框 ===== -->
  <!-- 左框：PC-A 慢线程 -->
  <g>
    <rect x="56" y="200" width="520" height="440" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <!-- 顶部标签 -->
    <rect x="56" y="200" width="520" height="40" fill="#C9A961"/>
    <text x="76" y="225" font-size="14" font-weight="700" fill="#0A2540" letter-spacing="1" class="en-sans">SLOW LOOP · &lt;=100 Hz</text>
    <text x="556" y="225" font-size="12" font-weight="600" fill="#0A2540" text-anchor="end" class="mono">PC-A · i7</text>

    <text x="76" y="270" font-size="20" font-weight="700" fill="#0A2540" class="sans-body">上位机 · 规划与认知</text>
    <text x="76" y="290" font-size="11" fill="#8B95A8" letter-spacing="0.5" class="en-sans">Planning / Perception / Cognition</text>

    <line x1="76" y1="302" x2="556" y2="302" stroke="#8B95A8" stroke-width="0.3" opacity="0.4"/>

    <!-- 子模块列表 -->
    <g>
      <rect x="76" y="320" width="12" height="12" fill="none" stroke="#C9A961" stroke-width="1"/>
      <text x="100" y="331" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">MoveIt 2 / Nav2</text>
      <text x="300" y="331" font-size="12" fill="#8B95A8" class="sans-body">运动与导航规划</text>
    </g>
    <g>
      <rect x="76" y="358" width="12" height="12" fill="none" stroke="#C9A961" stroke-width="1"/>
      <text x="100" y="369" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">Perception</text>
      <text x="300" y="369" font-size="12" fill="#8B95A8" class="sans-body">视觉识别 · 语义场景</text>
    </g>
    <g>
      <rect x="76" y="396" width="12" height="12" fill="none" stroke="#C9A961" stroke-width="1"/>
      <text x="100" y="407" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">Voice / Head</text>
      <text x="300" y="407" font-size="12" fill="#8B95A8" class="sans-body">唤醒 + ASR + NLU</text>
    </g>
    <g>
      <rect x="76" y="434" width="12" height="12" fill="none" stroke="#C9A961" stroke-width="1"/>
      <text x="100" y="445" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">VLA Agent (可选)</text>
      <text x="300" y="445" font-size="12" fill="#8B95A8" class="sans-body">Skill 编排</text>
    </g>
    <g>
      <rect x="76" y="472" width="12" height="12" fill="none" stroke="#C9A961" stroke-width="1"/>
      <text x="100" y="483" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">Safety Manager</text>
      <text x="300" y="483" font-size="12" fill="#8B95A8" class="sans-body">安全层 · 软逻辑</text>
    </g>

    <!-- 指标 -->
    <line x1="76" y1="530" x2="556" y2="530" stroke="#C9A961" stroke-width="0.8" opacity="0.6"/>
    <text x="76" y="556" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">TYPICAL LATENCY</text>
    <text x="76" y="584" font-size="15" font-weight="600" fill="#0A2540" class="mono">10 - 100 ms</text>
    <text x="76" y="612" font-size="12" fill="#8B95A8" class="sans-body">允许抖动 · 非实时</text>
  </g>

  <!-- 中间通信通道 -->
  <g>
    <rect x="580" y="360" width="120" height="120" fill="none" stroke="#C9A961" stroke-width="1.5" rx="2"/>
    <text x="640" y="392" font-size="11" fill="#C9A961" text-anchor="middle" letter-spacing="2" font-weight="700" class="en-sans">2.5 GbE</text>
    <text x="640" y="410" font-size="11" fill="#C9A961" text-anchor="middle" letter-spacing="2" font-weight="700" class="en-sans">DDS</text>
    <!-- 双向箭头 -->
    <path d="M 595 440 L 685 440" stroke="#C9A961" stroke-width="1.5" fill="none"/>
    <path d="M 600 435 L 595 440 L 600 445" stroke="#C9A961" stroke-width="1.5" fill="none"/>
    <path d="M 680 435 L 685 440 L 680 445" stroke="#C9A961" stroke-width="1.5" fill="none"/>
    <text x="640" y="464" font-size="10" fill="#8B95A8" text-anchor="middle" class="mono">Fast-DDS/UDP</text>
    <text x="640" y="476" font-size="10" fill="#8B95A8" text-anchor="middle" class="mono">RTT ~1 ms</text>
  </g>

  <!-- 右框：PC-B 快线程 -->
  <g>
    <rect x="704" y="200" width="520" height="440" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <rect x="704" y="200" width="520" height="40" fill="#C9A961"/>
    <text x="724" y="225" font-size="14" font-weight="700" fill="#0A2540" letter-spacing="1" class="en-sans">FAST LOOP · 1 kHz PREEMPT_RT</text>
    <text x="1204" y="225" font-size="12" font-weight="600" fill="#0A2540" text-anchor="end" class="mono">PC-B · i5</text>

    <text x="724" y="270" font-size="20" font-weight="700" fill="#0A2540" class="sans-body">下位机 · 实时控制</text>
    <text x="724" y="290" font-size="11" fill="#8B95A8" letter-spacing="0.5" class="en-sans">Real-Time Control / Safety / Drivers</text>

    <line x1="724" y1="302" x2="1204" y2="302" stroke="#8B95A8" stroke-width="0.3" opacity="0.4"/>

    <g>
      <rect x="724" y="320" width="12" height="12" fill="#C9A961"/>
      <text x="748" y="331" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">ros2_control</text>
      <text x="920" y="331" font-size="12" fill="#8B95A8" class="mono">1 kHz 循环</text>
    </g>
    <g>
      <rect x="724" y="350" width="12" height="12" fill="#C9A961"/>
      <text x="748" y="361" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">compensated_impedance</text>
      <text x="920" y="361" font-size="12" fill="#8B95A8" class="sans-body">力矩前馈</text>
    </g>
    <g>
      <rect x="724" y="380" width="12" height="12" fill="#C9A961"/>
      <text x="748" y="391" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">Pinocchio RNEA</text>
      <text x="920" y="391" font-size="12" fill="#8B95A8" class="sans-body">动力学</text>
    </g>
    <g>
      <rect x="724" y="410" width="12" height="12" fill="#C9A961"/>
      <text x="748" y="421" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">Ruckig Type V</text>
      <text x="920" y="421" font-size="12" fill="#8B95A8" class="sans-body">jerk-limited</text>
    </g>
    <g>
      <rect x="724" y="440" width="12" height="12" fill="#C9A961"/>
      <text x="748" y="451" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">Safety Watchdog</text>
      <text x="920" y="451" font-size="12" fill="#8B95A8" class="sans-body">急停 / 心跳 / 限位</text>
    </g>
    <g>
      <rect x="724" y="470" width="12" height="12" fill="#C9A961"/>
      <text x="748" y="481" font-size="14" font-weight="600" fill="#2B3340" class="sans-body">chassis_driver</text>
      <text x="920" y="481" font-size="12" fill="#8B95A8" class="mono">SocketCAN</text>
    </g>

    <line x1="724" y1="530" x2="1204" y2="530" stroke="#C9A961" stroke-width="0.8" opacity="0.6"/>
    <text x="724" y="556" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">CYCLE JITTER</text>
    <text x="724" y="584" font-size="15" font-weight="600" fill="#C9A961" class="mono">P99 &lt;100 us</text>
    <text x="724" y="612" font-size="12" fill="#8B95A8" class="sans-body">硬实时 · 确定性</text>
  </g>

  <!-- ===== 底部三个执行单元 ===== -->
  <!-- 从 PC-B 到三单元的连接线 -->
  <line x1="900" y1="640" x2="236" y2="666" stroke="#8B95A8" stroke-width="0.8" opacity="0.5"/>
  <line x1="900" y1="640" x2="640" y2="666" stroke="#8B95A8" stroke-width="0.8" opacity="0.5"/>
  <line x1="900" y1="640" x2="1044" y2="666" stroke="#8B95A8" stroke-width="0.8" opacity="0.5"/>

  <g>
    <rect x="56" y="660" width="260" height="30" fill="none" stroke="#2B3340" stroke-width="1" rx="2"/>
    <text x="186" y="679" font-size="12" fill="#2B3340" text-anchor="middle" class="sans-body">左臂 · CAN 1 · 达妙 DM x 5</text>
  </g>
  <g>
    <rect x="332" y="660" width="260" height="30" fill="none" stroke="#2B3340" stroke-width="1" rx="2"/>
    <text x="462" y="679" font-size="12" fill="#2B3340" text-anchor="middle" class="sans-body">右臂 · CAN 2 · 达妙 DM x 5</text>
  </g>
  <g>
    <rect x="608" y="660" width="300" height="30" fill="none" stroke="#2B3340" stroke-width="1" rx="2"/>
    <text x="758" y="679" font-size="12" fill="#2B3340" text-anchor="middle" class="sans-body">底盘 · CANopen · ZLAC8015D + 轮毂 x 4</text>
  </g>
  <g>
    <rect x="924" y="660" width="240" height="30" fill="none" stroke="#C9A961" stroke-width="1" rx="2" stroke-dasharray="3 2"/>
    <text x="1044" y="679" font-size="11" fill="#8B95A8" text-anchor="middle" class="sans-body">升降轴 · EtherCAT / SOEM 软 Master</text>
  </g>

  <!-- 页脚 -->
  <text x="56" y="716" font-size="11" fill="#8B95A8" class="sans-body">XC-Robot · 2026-04 阶段汇报 · 袁鑫</text>
  <text x="1224" y="716" font-size="11" fill="#8B95A8" text-anchor="end" class="en-sans">8 / 34</text>

</svg>

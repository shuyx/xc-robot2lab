<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css">
      .serif-title { font-family: 'Source Han Serif SC','Noto Serif CJK SC','Songti SC','SimSun',serif; }
      .sans-body   { font-family: 'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .en-serif    { font-family: 'Merriweather','Georgia','Times New Roman',serif; }
      .en-sans     { font-family: 'Inter','Helvetica Neue','Arial',sans-serif; }
      .mono        { font-family: 'JetBrains Mono','SF Mono','Menlo','Consolas',monospace; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect width="1280" height="720" fill="#F7F3EB"/>
  <rect x="0" y="0" width="4" height="720" fill="#C9A961"/>

  <!-- ===== 顶部标题区 ===== -->
  <text x="56" y="62" font-size="13" fill="#C9A961" letter-spacing="2" class="sans-body">
    PART E · 讨论焦点
  </text>

  <text x="56" y="116" font-size="38" font-weight="700" fill="#0A2540" class="serif-title">
    3 大讨论议题
  </text>

  <text x="56" y="148" font-size="16" fill="#8B95A8" font-style="italic" class="en-serif">
    Three Key Topics for Panel — Open Questions
  </text>

  <line x1="56" y1="168" x2="220" y2="168" stroke="#C9A961" stroke-width="2"/>
  <line x1="220" y1="168" x2="560" y2="168" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>

  <!-- ===== 议题 1 ===== -->
  <g>
    <rect x="56" y="186" width="1168" height="152" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <rect x="56" y="186" width="4" height="152" fill="#C9A961"/>
    <!-- 大号议题编号（右侧背景） -->
    <text x="1196" y="308" text-anchor="end" font-size="72" font-weight="700" fill="#C9A961" opacity="0.2" class="en-serif">Q1</text>

    <!-- 议题标签 -->
    <text x="76" y="212" font-size="11" fill="#C9A961" letter-spacing="2" class="sans-body">TOPIC 01 · 合同对齐</text>
    <!-- 议题标题 -->
    <text x="76" y="242" font-size="20" font-weight="700" fill="#0A2540" class="serif-title">
      +/- 0.1 mm 分层承诺的客户对齐
    </text>
    <!-- 分隔线 -->
    <line x1="76" y1="254" x2="300" y2="254" stroke="#C9A961" stroke-width="1" opacity="0.8"/>

    <!-- 子问题（3 条） -->
    <text x="76" y="278" font-size="12" fill="#2B3340" class="sans-body">
      <tspan x="76" dy="0">1. 关节层 +/- 0.5mm + 任务层 +/- 0.1mm 的分层口径是否足以支撑合同验收</tspan>
      <tspan x="76" dy="20">2. 是否需要跟客户/海安研究院主动重新拉齐预期</tspan>
      <tspan x="76" dy="20">3. 第三方 CNAS 检测用哪种测试方法（自由空间 vs 接触任务）</tspan>
    </text>

    <!-- 请专家建议 -->
    <text x="820" y="324" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">
      请专家建议 · <tspan fill="#8B95A8" font-weight="400">分层承诺的对外话术 / 答辩口径</tspan>
    </text>
  </g>

  <!-- ===== 议题 2 ===== -->
  <g>
    <rect x="56" y="354" width="1168" height="152" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <rect x="56" y="354" width="4" height="152" fill="#C9A961"/>
    <text x="1196" y="476" text-anchor="end" font-size="72" font-weight="700" fill="#C9A961" opacity="0.2" class="en-serif">Q2</text>

    <text x="76" y="380" font-size="11" fill="#C9A961" letter-spacing="2" class="sans-body">TOPIC 02 · 技术路线</text>
    <text x="76" y="410" font-size="20" font-weight="700" fill="#0A2540" class="serif-title">
      一期不做 VLA 的合理性
    </text>
    <line x1="76" y1="422" x2="300" y2="422" stroke="#C9A961" stroke-width="1" opacity="0.8"/>

    <text x="76" y="446" font-size="12" fill="#2B3340" class="sans-body">
      <tspan x="76" dy="0">1. 当前脚本化 Skill + 闭集指令是否已够支撑 3C/办公场景</tspan>
      <tspan x="76" dy="20">2. 是否需二期外挂 Hailo-8 26 TOPS NPU（单价 ¥2k-3k）</tspan>
      <tspan x="76" dy="20">3. VLA 模型选型（OpenVLA / RT-2 / 自训练）时机</tspan>
    </text>

    <text x="820" y="492" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">
      请专家建议 · <tspan fill="#8B95A8" font-weight="400">VLA 路线的优先级与切入点</tspan>
    </text>
  </g>

  <!-- ===== 议题 3 ===== -->
  <g>
    <rect x="56" y="522" width="1168" height="152" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <rect x="56" y="522" width="4" height="152" fill="#C9A961"/>
    <text x="1196" y="644" text-anchor="end" font-size="72" font-weight="700" fill="#C9A961" opacity="0.2" class="en-serif">Q3</text>

    <text x="76" y="548" font-size="11" fill="#C9A961" letter-spacing="2" class="sans-body">TOPIC 03 · 战略路径</text>
    <text x="76" y="578" font-size="20" font-weight="700" fill="#0A2540" class="serif-title">
      双 RDK 方案的二期评估时机
    </text>
    <line x1="76" y1="590" x2="300" y2="590" stroke="#C9A961" stroke-width="1" opacity="0.8"/>

    <text x="76" y="614" font-size="12" fill="#2B3340" class="sans-body">
      <tspan x="76" dy="0">1. X86 BPU 0 + 国产化率低 · 战略劣势何时成为短板</tspan>
      <tspan x="76" dy="20">2. RDK S100（128 TOPS BPU）二期启动双线评估的触发条件</tspan>
      <tspan x="76" dy="20">3. 客户国产化需求是硬性还是加分项</tspan>
    </text>

    <text x="820" y="660" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">
      请专家建议 · <tspan fill="#8B95A8" font-weight="400">战略路径切换的决策窗口</tspan>
    </text>
  </g>

  <!-- ===== 底部提示 ===== -->
  <text x="640" y="702" text-anchor="middle" font-size="12" fill="#0A2540" font-style="italic" class="sans-body">
    以上议题征求专家建议 · 不预设立场
  </text>

  <!-- ===== 页脚 ===== -->
  <line x1="56" y1="686" x2="1224" y2="686" stroke="#8B95A8" stroke-width="0.3" opacity="0.3"/>
  <text x="56" y="706" font-size="11" fill="#8B95A8" class="sans-body">XC-Robot · 2026-04 阶段汇报 · 袁鑫</text>
  <text x="1224" y="706" font-size="11" fill="#8B95A8" text-anchor="end" class="en-sans">32 / 34</text>

</svg>

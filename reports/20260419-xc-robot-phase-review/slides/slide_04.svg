<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css">
      .serif-title { font-family: 'Source Han Serif SC','Noto Serif CJK SC','Songti SC','SimSun',serif; }
      .sans-body   { font-family: 'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .en-serif    { font-family: 'Merriweather','Georgia','Times New Roman',serif; }
      .en-sans     { font-family: 'Inter','Helvetica Neue','Arial',sans-serif; }
      .mono        { font-family: 'JetBrains Mono','SF Mono','Menlo','Consolas',monospace; }
    </style>
  </defs>

  <!-- 背景：象牙米白 -->
  <rect width="1280" height="720" fill="#F7F3EB"/>

  <!-- 左侧章节竖线（学院金） -->
  <rect x="0" y="0" width="4" height="720" fill="#C9A961"/>

  <!-- ===== 顶部章节标识 ===== -->
  <text x="56" y="62" font-size="13" fill="#C9A961" letter-spacing="2" class="sans-body">
    PART A · 项目背景 / P4 · 软件栈全景
  </text>

  <!-- ===== 主标题 ===== -->
  <text x="56" y="116" font-size="38" font-weight="700" fill="#0A2540" class="serif-title">
    软件栈全景 · ROS 2 Humble 生态
  </text>

  <!-- ===== 英文副标题 ===== -->
  <text x="56" y="148" font-size="16" fill="#8B95A8" font-style="italic" class="en-serif">
    Software Stack Overview — 9 Components on Upstream ROS 2
  </text>

  <!-- ===== 标题底部装饰线 ===== -->
  <line x1="56" y1="168" x2="220" y2="168" stroke="#C9A961" stroke-width="2"/>
  <line x1="220" y1="168" x2="560" y2="168" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>

  <!-- ===== 3 x 3 细线框矩阵 ===== -->
  <!-- 每格 370 x 150；水平间隙 14；垂直间隙 14；起点 x=56, y=196 -->

  <!-- Row 1 -->

  <!-- [1,1] OS 层 -->
  <g>
    <rect x="56" y="196" width="370" height="150" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="76" y="222" font-size="11" fill="#C9A961" letter-spacing="1" class="sans-body">OS LAYER · 操作系统</text>
    <text x="76" y="258" font-size="16" font-weight="600" fill="#0A2540" class="sans-body">Ubuntu 22.04 LTS</text>
    <line x1="76" y1="272" x2="176" y2="272" stroke="#C9A961" stroke-width="1" opacity="0.8"/>
    <text x="76" y="298" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="76" dy="0">+ PREEMPT_RT 6.1+</tspan>
      <tspan x="76" dy="20">+ isolcpus 专核隔离</tspan>
    </text>
  </g>

  <!-- [1,2] 实时控制 -->
  <g>
    <rect x="440" y="196" width="370" height="150" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="460" y="222" font-size="11" fill="#C9A961" letter-spacing="1" class="sans-body">REAL-TIME CONTROL · 实时控制</text>
    <text x="460" y="258" font-size="16" font-weight="600" fill="#0A2540" class="sans-body">ros2_control</text>
    <line x1="460" y1="272" x2="560" y2="272" stroke="#C9A961" stroke-width="1" opacity="0.8"/>
    <text x="460" y="298" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="460" dy="0">+ controller_manager</tspan>
      <tspan x="460" dy="20">目标 </tspan>
      <tspan font-weight="600" fill="#C9A961">500 Hz</tspan>
    </text>
  </g>

  <!-- [1,3] 导航栈 -->
  <g>
    <rect x="824" y="196" width="370" height="150" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="844" y="222" font-size="11" fill="#C9A961" letter-spacing="1" class="sans-body">NAVIGATION · 导航栈</text>
    <text x="844" y="258" font-size="16" font-weight="600" fill="#0A2540" class="sans-body">Nav2 + AMCL</text>
    <line x1="844" y1="272" x2="944" y2="272" stroke="#C9A961" stroke-width="1" opacity="0.8"/>
    <text x="844" y="298" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="844" dy="0">+ Cartographer / SLAM Toolbox</tspan>
      <tspan x="844" dy="20">2D SLAM 定位建图</tspan>
    </text>
  </g>

  <!-- Row 2 -->

  <!-- [2,1] 状态估计 -->
  <g>
    <rect x="56" y="360" width="370" height="150" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="76" y="386" font-size="11" fill="#C9A961" letter-spacing="1" class="sans-body">STATE ESTIMATION · 状态估计</text>
    <text x="76" y="422" font-size="16" font-weight="600" fill="#0A2540" class="sans-body">robot_localization</text>
    <line x1="76" y1="436" x2="176" y2="436" stroke="#C9A961" stroke-width="1" opacity="0.8"/>
    <text x="76" y="462" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="76" dy="0">+ EKF 扩展卡尔曼滤波</tspan>
      <tspan x="76" dy="20">轮式里程 + IMU 融合</tspan>
    </text>
  </g>

  <!-- [2,2] 运动规划 -->
  <g>
    <rect x="440" y="360" width="370" height="150" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="460" y="386" font-size="11" fill="#C9A961" letter-spacing="1" class="sans-body">MOTION PLANNING · 运动规划</text>
    <text x="460" y="422" font-size="16" font-weight="600" fill="#0A2540" class="sans-body">MoveIt 2 + Servo</text>
    <line x1="460" y1="436" x2="560" y2="436" stroke="#C9A961" stroke-width="1" opacity="0.8"/>
    <text x="460" y="462" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="460" dy="0">+ bimanual_moveit_config</tspan>
      <tspan x="460" dy="20">双臂同步规划</tspan>
    </text>
  </g>

  <!-- [2,3] 关节控制 -->
  <g>
    <rect x="824" y="360" width="370" height="150" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="844" y="386" font-size="11" fill="#C9A961" letter-spacing="1" class="sans-body">JOINT CONTROL · 关节控制</text>
    <text x="844" y="422" font-size="16" font-weight="600" fill="#0A2540" class="sans-body">ros2_control</text>
    <line x1="844" y1="436" x2="944" y2="436" stroke="#C9A961" stroke-width="1" opacity="0.8"/>
    <text x="844" y="462" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="844" dy="0">+ compensated_impedance</tspan>
      <tspan x="844" dy="20">_controller</tspan>
    </text>
  </g>

  <!-- Row 3 -->

  <!-- [3,1] 通信协议 -->
  <g>
    <rect x="56" y="524" width="370" height="150" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="76" y="550" font-size="11" fill="#C9A961" letter-spacing="1" class="sans-body">COMMUNICATION · 通信协议</text>
    <text x="76" y="586" font-size="16" font-weight="600" fill="#0A2540" class="sans-body">CAN / MIT / EtherCAT</text>
    <line x1="76" y1="600" x2="176" y2="600" stroke="#C9A961" stroke-width="1" opacity="0.8"/>
    <text x="76" y="626" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="76" dy="0">CANopen 底盘 · MIT 机械臂</tspan>
      <tspan x="76" dy="20">EtherCAT 升降</tspan>
    </text>
  </g>

  <!-- [3,2] 视觉感知 -->
  <g>
    <rect x="440" y="524" width="370" height="150" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="460" y="550" font-size="11" fill="#C9A961" letter-spacing="1" class="sans-body">VISION · 视觉感知</text>
    <text x="460" y="586" font-size="16" font-weight="600" fill="#0A2540" class="sans-body">OpenCV + YOLOv8</text>
    <line x1="460" y1="600" x2="560" y2="600" stroke="#C9A961" stroke-width="1" opacity="0.8"/>
    <text x="460" y="626" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="460" dy="0">+ RGB-D 深度</tspan>
      <tspan x="460" dy="20">OpenVINO iGPU 加速</tspan>
    </text>
  </g>

  <!-- [3,3] 语音交互 -->
  <g>
    <rect x="824" y="524" width="370" height="150" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <text x="844" y="550" font-size="11" fill="#C9A961" letter-spacing="1" class="sans-body">VOICE · 语音交互</text>
    <text x="844" y="586" font-size="16" font-weight="600" fill="#0A2540" class="sans-body">Porcupine + Sherpa</text>
    <line x1="844" y1="600" x2="944" y2="600" stroke="#C9A961" stroke-width="1" opacity="0.8"/>
    <text x="844" y="626" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="844" dy="0">Paraformer ASR</tspan>
      <tspan x="844" dy="20">+ Piper TTS</tspan>
    </text>
  </g>

  <!-- ===== 底部说明行 ===== -->
  <line x1="56" y1="688" x2="1224" y2="688" stroke="#8B95A8" stroke-width="0.3" opacity="0.3"/>
  <text x="56" y="706" font-size="11" fill="#8B95A8" class="sans-body">XC-Robot · 2026-04 阶段汇报 · 袁鑫</text>
  <text x="640" y="706" font-size="11" fill="#8B95A8" font-style="italic" text-anchor="middle" class="sans-body">
    统一上游 ROS 2 Humble · Franka / UR / JAKA 官方推荐同款路线
  </text>
  <text x="1224" y="706" font-size="11" fill="#8B95A8" text-anchor="end" class="en-sans">04 / 34</text>

</svg>

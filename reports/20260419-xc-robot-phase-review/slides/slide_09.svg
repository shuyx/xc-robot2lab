<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css">
      .serif-title { font-family: 'Source Han Serif SC','Noto Serif CJK SC','Songti SC','SimSun',serif; }
      .sans-body   { font-family: 'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .en-serif    { font-family: 'Merriweather','Georgia','Times New Roman',serif; }
      .en-sans     { font-family: 'Inter','Helvetica Neue','Arial',sans-serif; }
      .mono        { font-family: 'JetBrains Mono','SF Mono','Menlo','Consolas',monospace; }
    </style>
  </defs>

  <!-- 章节过渡页：深靛蓝全底 -->
  <rect width="1280" height="720" fill="#0A2540"/>

  <!-- 右下角背景装饰 C -->
  <text x="1280" y="700" font-size="500" font-weight="700" fill="#C9A961" opacity="0.06" text-anchor="end" class="en-serif">C</text>

  <!-- 左上角章节编号 -->
  <text x="56" y="80" font-size="18" fill="#C9A961" letter-spacing="4" font-weight="700" class="en-serif">PART C</text>
  <line x1="56" y1="94" x2="140" y2="94" stroke="#C9A961" stroke-width="1.5"/>

  <!-- 主标题 -->
  <text x="56" y="200" font-size="52" font-weight="700" fill="#F7F3EB" class="serif-title">
    核心问题深度剖析
  </text>

  <!-- 副标题（学院金） -->
  <text x="56" y="248" font-size="28" font-weight="600" fill="#C9A961" class="serif-title">
    感知 / 控制 / 调度 · 三位一体
  </text>

  <!-- 英文副标题 -->
  <text x="56" y="284" font-size="20" fill="#8B95A8" font-style="italic" class="en-serif">
    Deep Dive on Core Problems — Perception, Control, Orchestration
  </text>

  <!-- 装饰分隔线 -->
  <line x1="56" y1="310" x2="300" y2="310" stroke="#C9A961" stroke-width="2"/>

  <!-- ===== 主体可视化：三个相连的圆 ===== -->
  <!-- 圆位置：y=460，圆心 x: 320 / 640 / 960，半径 90 -->

  <!-- 连接线（学院金双向箭头） -->
  <line x1="412" y1="460" x2="548" y2="460" stroke="#C9A961" stroke-width="2"/>
  <!-- 箭头 -->
  <path d="M 420 455 L 412 460 L 420 465" stroke="#C9A961" stroke-width="2" fill="none"/>
  <path d="M 540 455 L 548 460 L 540 465" stroke="#C9A961" stroke-width="2" fill="none"/>

  <line x1="732" y1="460" x2="868" y2="460" stroke="#C9A961" stroke-width="2"/>
  <path d="M 740 455 L 732 460 L 740 465" stroke="#C9A961" stroke-width="2" fill="none"/>
  <path d="M 860 455 L 868 460 L 860 465" stroke="#C9A961" stroke-width="2" fill="none"/>

  <!-- 圆 1 · 感知 -->
  <g>
    <circle cx="320" cy="460" r="90" fill="none" stroke="#C9A961" stroke-width="1.5"/>
    <circle cx="320" cy="460" r="90" fill="#C9A961" opacity="0.06"/>
    <text x="320" y="442" font-size="11" fill="#C9A961" text-anchor="middle" letter-spacing="2" class="en-sans">PROBLEM 1</text>
    <text x="320" y="472" font-size="28" font-weight="700" fill="#F7F3EB" text-anchor="middle" class="serif-title">感 知</text>
    <text x="320" y="498" font-size="11" fill="#8B95A8" text-anchor="middle" class="en-sans">Perception</text>
  </g>
  <text x="320" y="586" font-size="14" fill="#F7F3EB" text-anchor="middle" class="sans-body">底盘 SLAM</text>
  <text x="320" y="606" font-size="14" fill="#F7F3EB" text-anchor="middle" class="sans-body">多模态视觉 · 力觉</text>

  <!-- 圆 2 · 控制 -->
  <g>
    <circle cx="640" cy="460" r="90" fill="none" stroke="#C9A961" stroke-width="1.5"/>
    <circle cx="640" cy="460" r="90" fill="#C9A961" opacity="0.06"/>
    <text x="640" y="442" font-size="11" fill="#C9A961" text-anchor="middle" letter-spacing="2" class="en-sans">PROBLEM 2</text>
    <text x="640" y="472" font-size="28" font-weight="700" fill="#F7F3EB" text-anchor="middle" class="serif-title">控 制</text>
    <text x="640" y="498" font-size="11" fill="#8B95A8" text-anchor="middle" class="en-sans">Control</text>
  </g>
  <text x="640" y="586" font-size="14" fill="#F7F3EB" text-anchor="middle" class="sans-body">双臂关节稳定</text>
  <text x="640" y="606" font-size="14" fill="#F7F3EB" text-anchor="middle" class="sans-body">精度分层承诺</text>

  <!-- 圆 3 · 调度 -->
  <g>
    <circle cx="960" cy="460" r="90" fill="none" stroke="#C9A961" stroke-width="1.5"/>
    <circle cx="960" cy="460" r="90" fill="#C9A961" opacity="0.06"/>
    <text x="960" y="442" font-size="11" fill="#C9A961" text-anchor="middle" letter-spacing="2" class="en-sans">PROBLEM 3</text>
    <text x="960" y="472" font-size="28" font-weight="700" fill="#F7F3EB" text-anchor="middle" class="serif-title">调 度</text>
    <text x="960" y="498" font-size="11" fill="#8B95A8" text-anchor="middle" class="en-sans">Orchestration</text>
  </g>
  <text x="960" y="586" font-size="14" fill="#F7F3EB" text-anchor="middle" class="sans-body">任务理解</text>
  <text x="960" y="606" font-size="14" fill="#F7F3EB" text-anchor="middle" class="sans-body">协同执行</text>

  <!-- 底部总结横线与文字 -->
  <line x1="340" y1="644" x2="940" y2="644" stroke="#C9A961" stroke-width="2"/>
  <text x="640" y="670" font-size="16" fill="#F7F3EB" text-anchor="middle" font-style="italic" class="sans-body">
    任何一环短板 · 都会被放大到末端失败率
  </text>

  <!-- 页脚（反转风格） -->
  <text x="56" y="700" font-size="11" fill="#8B95A8" class="sans-body">XC-Robot · 2026-04 阶段汇报 · 袁鑫</text>
  <text x="1224" y="700" font-size="11" fill="#8B95A8" text-anchor="end" class="en-sans">9 / 34</text>

</svg>

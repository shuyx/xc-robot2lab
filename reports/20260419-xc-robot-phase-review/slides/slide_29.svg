    <rect x="300" y="556" width="180" height="36" fill="none" stroke="#2B3340" stroke-width="0.8" rx="2"/>
    <text x="390" y="573" text-anchor="middle" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">急停硬件</text>

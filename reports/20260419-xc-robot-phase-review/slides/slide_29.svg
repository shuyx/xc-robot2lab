    <text x="419" y="447" text-anchor="middle" font-size="10" fill="#8B95A8" class="en-sans">1w</text>

    <rect x="546" y="416" width="238" height="36" fill="none" stroke="#2B3340" stroke-width="0.8" rx="2"/>
    <text x="665" y="433" text-anchor="middle" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">V2 物料 6D + YOLO</text>
    <text x="665" y="447" text-anchor="middle" font-size="10" fill="#8B95A8" class="en-sans">2w</text>


    <text x="495" y="517" text-anchor="middle" font-size="10" fill="#8B95A8" class="en-sans">2w</text>

    <rect x="698" y="486" width="384" height="36" fill="none" stroke="#2B3340" stroke-width="0.8" rx="2"/>
    <text x="890" y="503" text-anchor="middle" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">S2 Action 联动 + TTS</text>
    <text x="890" y="517" text-anchor="middle" font-size="10" fill="#8B95A8" class="en-sans">1w</text>

    <text x="1200" y="510" text-anchor="end" font-size="24" font-weight="700" fill="#C9A961" class="en-serif">3w</text>
  </g>

  <!-- P0-5 基础安全框架 -->
  <g>
    <rect x="56" y="546" width="1040" height="56" fill="none" stroke="#2B3340" stroke-width="1" rx="2"/>
    <rect x="56" y="546" width="6" height="56" fill="#0A2540"/>

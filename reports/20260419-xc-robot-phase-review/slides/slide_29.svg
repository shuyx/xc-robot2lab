    <rect x="676" y="556" width="180" height="36" fill="none" stroke="#2B3340" stroke-width="0.8" rx="2"/>
    <text x="766" y="573" text-anchor="middle" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">软限位</text>
    <text x="766" y="587" text-anchor="middle" font-size="10" fill="#8B95A8" class="en-sans">Soft Limits</text>

    <rect x="864" y="556" width="218" height="36" fill="none" stroke="#2B3340" stroke-width="0.8" rx="2"/>
    <text x="973" y="573" text-anchor="middle" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">电流门限</text>
    <text x="973" y="587" text-anchor="middle" font-size="10" fill="#8B95A8" class="en-sans">Current Threshold</text>

    <text x="1200" y="580" text-anchor="end" font-size="24" font-weight="700" fill="#C9A961" class="en-serif">1w</text>
  </g>

  <!-- ===== 底部并行原则 ===== -->
  <rect x="56" y="616" width="1168" height="60" fill="none" stroke="#2B3340" stroke-width="1" rx="2"/>
  <line x1="640" y1="616" x2="640" y2="676" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>
  <text x="72" y="638" font-size="11" fill="#8B95A8" letter-spacing="1" class="sans-body">PARALLEL PRINCIPLE · 并行原则</text>
  <text x="72" y="660" font-size="14" fill="#2B3340" class="sans-body">
    所有 P0 项目从 W1 同时启动 · <tspan fill="#0A2540" font-weight="600">无串行依赖</tspan>
  </text>
  <text x="656" y="638" font-size="11" fill="#8B95A8" letter-spacing="1" class="sans-body">RESOURCE ALLOCATION · 资源分配</text>
  <text x="656" y="660" font-size="14" fill="#2B3340" class="sans-body">
    总资源 <tspan fill="#C9A961" font-weight="700">12 周</tspan>并行完成 / 非 <tspan fill="#8B95A8">7+4+4+3+1 串行 19 周</tspan>
  </text>

  <!-- ===== 页脚 ===== -->
  <line x1="56" y1="686" x2="1224" y2="686" stroke="#8B95A8" stroke-width="0.3" opacity="0.3"/>
  <text x="56" y="706" font-size="11" fill="#8B95A8" class="sans-body">XC-Robot · 2026-04 阶段汇报 · 袁鑫</text>
  <text x="1224" y="706" font-size="11" fill="#8B95A8" text-anchor="end" class="en-sans">29 / 34</text>


    <text x="691" y="363" text-anchor="middle" font-size="11" fill="#8B95A8" font-weight="600" class="sans-body">N3 建图</text>
    <text x="691" y="377" text-anchor="middle" font-size="10" fill="#C9A961" class="en-sans">已完成</text>

    <rect x="774" y="346" width="150" height="36" fill="none" stroke="#2B3340" stroke-width="0.8" rx="2"/>
    <text x="849" y="363" text-anchor="middle" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">N4 Nav2+AMCL</text>
    <text x="849" y="377" text-anchor="middle" font-size="10" fill="#8B95A8" class="en-sans">1w</text>

    <rect x="932" y="346" width="150" height="36" fill="none" stroke="#2B3340" stroke-width="0.8" rx="2"/>
    <text x="1007" y="363" text-anchor="middle" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">N5 AprilTag</text>
    <text x="1007" y="377" text-anchor="middle" font-size="10" fill="#8B95A8" class="en-sans">1w</text>

    <text x="1200" y="370" text-anchor="end" font-size="24" font-weight="700" fill="#C9A961" class="en-serif">4w</text>
  </g>

  <!-- P0-3 视觉识别+抓取 -->
  <g>
    <rect x="56" y="406" width="1040" height="56" fill="none" stroke="#2B3340" stroke-width="1" rx="2"/>

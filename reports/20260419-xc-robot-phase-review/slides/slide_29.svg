    <text x="375" y="363" text-anchor="middle" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">N1 里程计</text>
    <text x="375" y="377" text-anchor="middle" font-size="10" fill="#8B95A8" class="en-sans">1w</text>


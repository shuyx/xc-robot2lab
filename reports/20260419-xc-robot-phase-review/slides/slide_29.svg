    <text x="533" y="363" text-anchor="middle" font-size="11" fill="#0A2540" font-weight="600" class="sans-body">N2 EKF 融合</text>
    <text x="533" y="377" text-anchor="middle" font-size="10" fill="#8B95A8" class="en-sans">1w</text>


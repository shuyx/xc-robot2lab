    <text x="814" y="478" font-size="10" fill="#C9A961" letter-spacing="1" font-weight="600" class="sans-body">FINAL ACCURACY · 最终精度</text>
    <text x="1004" y="530" text-anchor="middle" font-size="38" font-weight="700" fill="#C9A961" class="mono">±0.1 mm</text>

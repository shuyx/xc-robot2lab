  <!-- ========== 底部主流工业路径 ========== -->
  <rect x="56" y="584" width="1168" height="98" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
  <rect x="56" y="584" width="220" height="28" fill="#0A2540"/>
  <text x="166" y="604" text-anchor="middle" font-size="12" fill="#F7F3EB" font-weight="700" letter-spacing="1" class="sans-body">INDUSTRY PATH · 主流工业路径</text>

  <text x="74" y="638" font-size="13" fill="#2B3340" class="sans-body">

  </text>

  <!-- ========== 主体：三层闭环架构 ========== -->
  <!-- 每节点 340x340，x: 56, 420, 784；y=246 -->

  <!-- ===== Layer 1 · 视觉粗定位 ===== -->
  <g>
    <rect x="56" y="246" width="340" height="320" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <!-- 层号徽章 -->
    <rect x="56" y="246" width="90" height="32" fill="#C9A961"/>
    <text x="101" y="267" text-anchor="middle" font-size="13" font-weight="700" fill="#0A2540" letter-spacing="1" class="en-sans">LAYER 1</text>
    <text x="76" y="310" font-size="20" font-weight="700" fill="#0A2540" class="sans-body">视觉粗定位</text>
    <text x="76" y="330" font-size="11" fill="#8B95A8" letter-spacing="0.5" class="en-sans">Visual Coarse Localization</text>
    <line x1="76" y1="342" x2="376" y2="342" stroke="#C9A961" stroke-width="1" opacity="0.8"/>

    <!-- 要点 -->
    <text x="76" y="368" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="76" dy="0">· YOLO 6D 位姿估计</tspan>
      <tspan x="76" dy="22">· ChArUco 锚点融合</tspan>
      <tspan x="76" dy="22">· 海康 RGB-D + IMU</tspan>
    </text>


    <text x="1201" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#0A2540" letter-spacing="1" class="en-sans">CORE</text>
    <text x="804" y="310" font-size="20" font-weight="700" fill="#0A2540" class="sans-body">在线微调</text>
    <text x="804" y="330" font-size="11" fill="#8B95A8" letter-spacing="0.5" class="en-sans">Online Fine-Tuning</text>

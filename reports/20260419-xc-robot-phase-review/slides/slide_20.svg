    <text x="86" y="478" font-size="10" fill="#C9A961" letter-spacing="1" font-weight="600" class="sans-body">METRICS</text>
    <text x="86" y="506" font-size="12" fill="#2B3340" class="sans-body">精度</text>
    <text x="366" y="506" text-anchor="end" font-size="17" fill="#C9A961" font-weight="700" class="mono">±5 mm</text>
    <text x="86" y="534" font-size="12" fill="#2B3340" class="sans-body">频率</text>
    <text x="366" y="534" text-anchor="end" font-size="17" fill="#C9A961" font-weight="700" class="mono">10 - 30 Hz</text>
  </g>

  <!-- 箭头 1 to 2 -->
  <g>
    <line x1="400" y1="406" x2="418" y2="406" stroke="#0A2540" stroke-width="1.2"/>
    <path d="M 414,401 L 420,406 L 414,411" fill="none" stroke="#0A2540" stroke-width="1.2"/>
  </g>


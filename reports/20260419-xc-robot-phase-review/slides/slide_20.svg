    <text x="440" y="330" font-size="11" fill="#8B95A8" letter-spacing="0.5" class="en-sans">Force-Compliant Contact</text>
    <line x1="440" y1="342" x2="740" y2="342" stroke="#C9A961" stroke-width="1" opacity="0.8"/>

    <text x="440" y="368" font-size="13" fill="#2B3340" class="sans-body">

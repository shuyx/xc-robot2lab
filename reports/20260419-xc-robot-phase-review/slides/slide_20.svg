    <text x="450" y="478" font-size="10" fill="#C9A961" letter-spacing="1" font-weight="600" class="sans-body">METRICS</text>
    <text x="450" y="506" font-size="12" fill="#2B3340" class="sans-body">反馈精度</text>
    <text x="730" y="506" text-anchor="end" font-size="17" fill="#C9A961" font-weight="700" class="mono">±0.1 N</text>
    <text x="450" y="534" font-size="12" fill="#2B3340" class="sans-body">环路延迟</text>
    <text x="730" y="534" text-anchor="end" font-size="17" fill="#C9A961" font-weight="700" class="mono">&lt; 2 ms</text>

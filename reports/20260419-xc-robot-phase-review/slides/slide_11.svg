<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style type="text/css">
      .serif-title { font-family: 'Source Han Serif SC','Noto Serif CJK SC','Songti SC','SimSun',serif; }
      .sans-body   { font-family: 'Source Han Sans SC','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif; }
      .en-serif    { font-family: 'Merriweather','Georgia','Times New Roman',serif; }
      .en-sans     { font-family: 'Inter','Helvetica Neue','Arial',sans-serif; }
      .mono        { font-family: 'JetBrains Mono','SF Mono','Menlo','Consolas',monospace; }
    </style>
  </defs>

  <rect width="1280" height="720" fill="#F7F3EB"/>
  <rect x="0" y="0" width="4" height="720" fill="#C9A961"/>

  <text x="56" y="62" font-size="13" fill="#C9A961" letter-spacing="2" class="sans-body">
    PART C · 核心问题剖析 / 大问题 1 · 底盘导航
  </text>

  <text x="56" y="116" font-size="38" font-weight="700" fill="#0A2540" class="serif-title">
    导航精度提升 · 4 步闭环
  </text>

  <text x="56" y="148" font-size="16" fill="#8B95A8" font-style="italic" class="en-serif">
    4-Step Precision Closure — Odometry / Fusion / Mapping / Tag Docking
  </text>

  <line x1="56" y1="168" x2="220" y2="168" stroke="#C9A961" stroke-width="2"/>
  <line x1="220" y1="168" x2="560" y2="168" stroke="#8B95A8" stroke-width="0.5" opacity="0.5"/>

  <!-- ===== 4 节点横排 Pipeline ===== -->
  <!-- 节点宽 266 高 310，起点 x=56，间隙 24 -->
  <!-- 连接虚线（穿过节点中心 y=380） -->
  <line x1="322" y1="380" x2="346" y2="380" stroke="#8B95A8" stroke-width="0.8" stroke-dasharray="5 3"/>
  <line x1="612" y1="380" x2="636" y2="380" stroke="#8B95A8" stroke-width="0.8" stroke-dasharray="5 3"/>
  <line x1="902" y1="380" x2="926" y2="380" stroke="#8B95A8" stroke-width="0.8" stroke-dasharray="5 3"/>

  <!-- Step 1 · ODOMETRY -->
  <g>
    <rect x="56" y="220" width="266" height="320" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <rect x="56" y="220" width="56" height="30" fill="#C9A961"/>
    <text x="84" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#0A2540" class="en-sans">STEP 1</text>
    <text x="76" y="288" font-size="17" font-weight="700" fill="#0A2540" class="sans-body">里程计清洁化</text>
    <text x="76" y="306" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">ODOMETRY CLEAN-UP</text>
    <line x1="76" y1="318" x2="302" y2="318" stroke="#C9A961" stroke-width="1" opacity="0.8"/>

    <text x="76" y="348" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="76" dy="0">· 游标卡尺实测</tspan>
      <tspan x="76" dy="19">  轮径 + 轴距</tspan>
      <tspan x="76" dy="30">· wheel_params.yaml</tspan>
      <tspan x="76" dy="19">  参数精确化</tspan>
      <tspan x="76" dy="30">· 消除系统性偏置</tspan>
      <tspan x="76" dy="19">  恢复里程计可信度</tspan>
    </text>

    <line x1="76" y1="492" x2="302" y2="492" stroke="#C9A961" stroke-width="0.8" opacity="0.5"/>
    <text x="76" y="514" font-size="10" fill="#8B95A8" letter-spacing="1" class="en-sans">METRIC</text>
    <text x="76" y="530" font-size="13" font-weight="700" fill="#C9A961" class="mono">10m 直线漂移 &lt;10 cm</text>
  </g>

  <!-- Step 2 · FUSION -->
  <g>
    <rect x="346" y="220" width="266" height="320" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <rect x="346" y="220" width="56" height="30" fill="#C9A961"/>
    <text x="374" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#0A2540" class="en-sans">STEP 2</text>
    <text x="366" y="288" font-size="17" font-weight="700" fill="#0A2540" class="sans-body">EKF 融合</text>
    <text x="366" y="306" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">SENSOR FUSION</text>
    <line x1="366" y1="318" x2="592" y2="318" stroke="#C9A961" stroke-width="1" opacity="0.8"/>

    <text x="366" y="348" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="366" dy="0">· robot_localization</tspan>
      <tspan x="366" dy="19">  ekf_filter_node</tspan>
      <tspan x="366" dy="30">· 轮式里程计 + IMU</tspan>
      <tspan x="366" dy="19">  ROSEB43i 6DoF</tspan>
      <tspan x="366" dy="30">· 抵抗打滑 / 瞬态</tspan>
      <tspan x="366" dy="19">  偏航快速收敛</tspan>
    </text>

    <line x1="366" y1="492" x2="592" y2="492" stroke="#C9A961" stroke-width="0.8" opacity="0.5"/>
    <text x="366" y="514" font-size="10" fill="#8B95A8" letter-spacing="1" class="en-sans">METRIC</text>
    <text x="366" y="530" font-size="13" font-weight="700" fill="#C9A961" class="mono">直角转弯 1s 收敛</text>
  </g>

  <!-- Step 3 · MAPPING -->
  <g>
    <rect x="636" y="220" width="266" height="320" fill="none" stroke="#2B3340" stroke-width="1" rx="3"/>
    <rect x="636" y="220" width="56" height="30" fill="#C9A961"/>
    <text x="664" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#0A2540" class="en-sans">STEP 3</text>
    <text x="656" y="288" font-size="17" font-weight="700" fill="#0A2540" class="sans-body">建图迁移</text>
    <text x="656" y="306" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">MAPPING MIGRATION</text>
    <line x1="656" y1="318" x2="882" y2="318" stroke="#C9A961" stroke-width="1" opacity="0.8"/>

    <text x="656" y="348" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="656" dy="0">· 当前 · Cartographer</tspan>
      <tspan x="656" dy="19">  ±3 cm 收敛中</tspan>
      <tspan x="656" dy="30">· 推荐迁 · SLAM Toolbox</tspan>
      <tspan x="656" dy="19">  生命周期维护友好</tspan>
      <tspan x="656" dy="30">· 动态 ATE</tspan>
      <tspan x="656" dy="19">  <tspan class="mono">0.13 m vs 0.21 m</tspan></tspan>
    </text>

    <line x1="656" y1="492" x2="882" y2="492" stroke="#C9A961" stroke-width="0.8" opacity="0.5"/>
    <text x="656" y="514" font-size="10" fill="#8B95A8" letter-spacing="1" class="en-sans">METRIC</text>
    <text x="656" y="530" font-size="13" font-weight="700" fill="#C9A961" class="mono">20m 回原点 &lt;10 cm</text>
  </g>

  <!-- Step 4 · TAG DOCKING（核心，学院金底） -->
  <g>
    <rect x="926" y="210" width="266" height="340" fill="#FFFDF5" stroke="#C9A961" stroke-width="1.5" rx="3"/>
    <rect x="926" y="210" width="56" height="30" fill="#0A2540"/>
    <text x="954" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#F7F3EB" class="en-sans">STEP 4</text>
    <rect x="1132" y="210" width="60" height="30" fill="#C9A961"/>
    <text x="1162" y="231" text-anchor="middle" font-size="11" font-weight="700" fill="#0A2540" class="en-sans">CORE</text>
    <text x="946" y="278" font-size="17" font-weight="700" fill="#0A2540" class="sans-body">精定位锚点</text>
    <text x="946" y="296" font-size="11" fill="#8B95A8" letter-spacing="1" class="en-sans">TAG-BASED DOCKING</text>
    <line x1="946" y1="308" x2="1172" y2="308" stroke="#C9A961" stroke-width="1.2"/>

    <text x="946" y="338" font-size="13" fill="#2B3340" class="sans-body">
      <tspan x="946" dy="0">· ChArUco bundle</tspan>
      <tspan x="946" dy="19">  每工位一组 Tag 阵列</tspan>
      <tspan x="946" dy="30">· Nav2 DockingServer</tspan>
      <tspan x="946" dy="19">  + AprilTag 视觉</tspan>
      <tspan x="946" dy="30">· tag_0 世界原点</tspan>
      <tspan x="946" dy="19">  工位 id = Tag id</tspan>
    </text>

    <line x1="946" y1="498" x2="1172" y2="498" stroke="#C9A961" stroke-width="0.8" opacity="0.8"/>
    <text x="946" y="520" font-size="10" fill="#8B95A8" letter-spacing="1" class="en-sans">ACCEPTANCE</text>
    <text x="946" y="542" font-size="15" font-weight="700" fill="#C9A961" class="mono">工位对接 &lt;3 cm</text>
  </g>

  <!-- 箭头：Step 4 向下指向总结框 -->
  <path d="M 1059 554 L 1059 584 L 640 584 L 640 596" stroke="#C9A961" stroke-width="1.5" fill="none" stroke-dasharray="none"/>
  <path d="M 634 590 L 640 596 L 646 590" stroke="#C9A961" stroke-width="1.5" fill="none"/>

  <!-- 总结框 -->
  <g>
    <rect x="56" y="600" width="1168" height="70" fill="none" stroke="#0A2540" stroke-width="1.5" rx="3"/>
    <text x="80" y="626" font-size="11" fill="#C9A961" letter-spacing="2" class="en-sans">ACCEPTANCE · 整体验收</text>
    <text x="80" y="654" font-size="16" fill="#2B3340" class="sans-body">
      10 次点选位点 · 平均偏差 <tspan fill="#C9A961" font-weight="700" class="mono">&lt;5 cm</tspan>
      <tspan dx="40">工位对接 10 次 · 平均</tspan> <tspan fill="#C9A961" font-weight="700" class="mono">&lt;3 cm</tspan>
    </text>
  </g>

  <!-- 页脚 -->
  <line x1="56" y1="686" x2="1224" y2="686" stroke="#8B95A8" stroke-width="0.3" opacity="0.3"/>
  <text x="56" y="706" font-size="11" fill="#8B95A8" class="sans-body">XC-Robot · 2026-04 阶段汇报 · 袁鑫</text>
  <text x="1224" y="706" font-size="11" fill="#8B95A8" text-anchor="end" class="en-sans">11 / 34</text>

</svg>
